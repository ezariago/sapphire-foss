name: macOS build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SAPPHIRE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain evidence
        run: |
          xcodebuild -version
          sw_vers
          java -version
      - name: Cache pinned Swift packages
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
      - name: Clipboard, DMG and native media tests
        run: |
          ./scripts/test-clipboard-tools.sh
          ./scripts/test-dmg-installer.sh
          ./scripts/test-media-tools.sh
      - name: Foundation security and FOSS access tests
        run: ./scripts/test-foundation.sh
      - name: Dock/window policies and quit protection tests
        run: |
          ./scripts/test-dock-layouts.sh
          ./scripts/test-quit-protection.sh
          ./scripts/test-window-cycling.sh
          ./scripts/test-auto-quit.sh
          ./scripts/test-keyboard-bounce.sh
          ./scripts/test-mouse-click-bounce.sh
          ./scripts/test-hover-focus.sh
          ./scripts/test-mouse-scroll.sh
          ./scripts/test-super-key.sh
          ./scripts/test-shortcut-dispatcher.sh
          ./scripts/test-snippets.sh
      - name: App Lock authentication lifecycle tests
        run: ./scripts/test-app-lock.sh
      - name: Isolated storage scan and refusal checks
        run: ./scripts/test-storage.sh
      - name: Monitoring thresholds and deferred-delivery checks
        run: ./scripts/test-monitoring.sh
      - name: Power sensor availability checks
        run: ./scripts/test-power-telemetry.sh
      - name: Spatial audio parameter and persistence checks
        run: ./scripts/test-spatial-audio.sh
      - name: Phone protocol and crypto tests
        run: ./scripts/test-phone-reconstruction.sh
      - name: Build and verify macOS app
        run: ./scripts/build-local.sh
      - name: Record dependency inputs and checksum
        run: |
          python3 scripts/dependency-inventory.py --output build/dependency-inventory.json
          shasum -a 256 build/Sapphire-local.zip > build/Sapphire-local.zip.sha256
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-FOSS-${{ runner.arch }}-${{ github.sha }}
          path: |
            build/Sapphire-local.zip
            build/Sapphire-local.zip.sha256
            build/dependency-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build-logs
          path: build/logs
          retention-days: 7
